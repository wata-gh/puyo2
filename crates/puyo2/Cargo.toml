[package]
name = "puyo2"
version = "0.2.0"
edition = "2024"
rust-version = "1.94"
description = "Puyo Puyo Tsu analysis library and CLI suite in Rust"
license = "MIT"
repository = "https://github.com/wata-gh/puyo2"
homepage = "https://github.com/wata-gh/puyo2"
readme = "README.md"
keywords = ["puyo", "puzzle", "cli", "solver", "parser"]
categories = ["command-line-utilities", "games", "parser-implementations"]
include = [
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "src/**",
]

[dependencies]
chrono = "0.4.45"
image = "0.25.10"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_repr = "0.1.21"
signal-hook = "0.4.4"
thiserror = "2.0.20"
url = "2.5.8"
