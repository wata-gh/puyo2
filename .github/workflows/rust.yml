name: Rust

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Install repository Rust toolchain
      run: |
        toolchain=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
        rustup toolchain install "$toolchain" --profile minimal --component rustfmt --component clippy
    - name: Build
      run: cargo build --workspace --all-targets --locked
    - name: Test
      run: cargo test --workspace --locked
    - name: Build release binaries
      run: cargo build --workspace --release --bins --locked
    - name: Verify package
      run: cargo package --manifest-path crates/puyo2/Cargo.toml --allow-dirty --locked
    - name: Verify install
      run: cargo install --path crates/puyo2 --locked --bin pnsolve --root "$RUNNER_TEMP/puyo2-install"
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Test declared minimum Rust version
        run: |
          msrv=$(python3 -c 'import tomllib; print(tomllib.load(open("crates/puyo2/Cargo.toml", "rb"))["package"]["rust-version"])')
          rustup toolchain install "$msrv" --profile minimal
          cargo +"$msrv" build --workspace --all-targets --locked
          cargo +"$msrv" test --workspace --locked
  maintenance-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s ops/maintenance/tests -v
